name: MSOBB owned PowerShell path normalization differential
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  path:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Probe published PowerShell 7.6.9 local path effects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'pwsh-7.6.9.zip'
          Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/PowerShell-7.6.9-win-x64.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($hash -ne 'CE7484804C0F0AD4DDA10C958E71ACDAF7EEBFB22505C1B480F89E0E9F1DA94D') { throw 'Published asset hash mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'MSOBB-pwsh-7.6.9'
          Expand-Archive $zip -DestinationPath $runtime -Force
          $exe = Join-Path $runtime 'pwsh.exe'
          $probe = Join-Path $env:RUNNER_TEMP 'MSOBB-path-probe.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'MSOBB-path-root'
          New-Item -ItemType Directory -Force $root | Out-Null
          $names = @('safe','..','.. ','...','. ',' .','.. .','  ..','trail. ','trail ')
          $type = [Microsoft.PowerShell.Commands.FileSystemProvider]
          $method = $type.GetMethod('CanRemoteNameCausePathTraversal', [Reflection.BindingFlags]'NonPublic, Static')
          $output = [ordered]@{ version = $PSVersionTable.PSVersion.ToString(); cases = @{} }
          $i = 0
          foreach ($name in $names) {
            $i++
            $dest = Join-Path $root ('case-' + $i)
            New-Item -ItemType Directory -Force $dest | Out-Null
            $candidate = [IO.Path]::Combine($dest,$name)
            $full = [IO.Path]::GetFullPath($candidate)
            $outside = !$full.StartsWith($dest + [IO.Path]::DirectorySeparatorChar,[StringComparison]::OrdinalIgnoreCase)
            $guard = if ($method) { [bool]$method.Invoke($null,@($name)) } else { $null }
            $created = $false; $actualOutside = $false; $errorType = $null
            try {
              [IO.Directory]::CreateDirectory($candidate) | Out-Null
              $marker = [IO.Path]::Combine($candidate,'MSOBB-marker.txt')
              [IO.File]::WriteAllText($marker,'MSOBB_MARKER')
              $created = [IO.File]::Exists($marker)
              $parentMarker = [IO.Path]::Combine([IO.Path]::GetDirectoryName($dest),'MSOBB-marker.txt')
              $actualOutside = [IO.File]::Exists($parentMarker)
              if ($actualOutside) { [IO.File]::Delete($parentMarker) }
            } catch { $errorType = $_.Exception.GetType().Name }
            $output.cases[$name] = [ordered]@{ guardRejects = $guard; fullPathOutside = $outside; created = $created; actualParentWrite = $actualOutside; errorType = $errorType }
          }
          Write-Host "MSOBB_RESULT=$($output | ConvertTo-Json -Compress -Depth 8)"
          '@ | Set-Content $probe -Encoding utf8
          & $exe -NoLogo -NoProfile -File $probe
          if ($LASTEXITCODE -ne 0) { throw "PowerShell runtime probe failed: $LASTEXITCODE" }
